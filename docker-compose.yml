# Local services for D2C Autopilot. Run: docker compose up -d
# Inngest dev server is not containerised; start it with: npx inngest-cli@latest dev
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: d2c
      POSTGRES_PASSWORD: d2c_local_only
      POSTGRES_DB: d2c_autopilot
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U d2c -d d2c_autopilot"]
      interval: 5s
      retries: 10

  postgres_test:
    image: postgres:17
    environment:
      POSTGRES_USER: d2c
      POSTGRES_PASSWORD: d2c_local_only
      POSTGRES_DB: d2c_autopilot_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U d2c -d d2c_autopilot_test"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: d2c_minio
      MINIO_ROOT_PASSWORD: d2c_minio_local_only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  pg_data:
  minio_data:
