# Local services for D2C Autopilot. Run: docker compose up -d
# Inngest dev server is not containerised; start it with: npm run inngest:dev
# Object storage uses SeaweedFS with its S3 gateway (MinIO images are not
# pullable from the registries this environment can reach).
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: d2c
      POSTGRES_PASSWORD: d2c_local_only
      POSTGRES_DB: d2c_autopilot
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U d2c -d d2c_autopilot"]
      interval: 5s
      retries: 10

  postgres_test:
    image: postgres:17
    environment:
      POSTGRES_USER: d2c
      POSTGRES_PASSWORD: d2c_local_only
      POSTGRES_DB: d2c_autopilot_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U d2c -d d2c_autopilot_test"]
      interval: 5s
      retries: 10

  storage:
    image: chrislusf/seaweedfs:latest
    command: server -s3 -s3.port=9000 -s3.config=/etc/seaweedfs/s3.json -dir=/data
    ports:
      - "9000:9000"
    volumes:
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
      - storage_data:/data

volumes:
  pg_data:
  storage_data:
